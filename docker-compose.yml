services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: giftpay
      POSTGRES_PASSWORD: giftpay
      POSTGRES_DB: giftpay
    ports:
      - "5432:5432"
    volumes:
      - giftpay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giftpay -d giftpay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  giftpay_pgdata:
